name: Deploy B1 Label Studio v4.2.0 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Reconstruct and verify v4.2.0 release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Reconstruct v4.2.0 and verify integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cat release/v4.2.0/part*.b64 > /tmp/b1-v4.2.0.html.gz.b64
          base64 --decode /tmp/b1-v4.2.0.html.gz.b64 > /tmp/b1-v4.2.0.html.gz
          gzip -dc /tmp/b1-v4.2.0.html.gz > _site/index.html

          printf '%s  %s\n' \
            '8360ee3661da495538eec598908e470ecfb7aa31b76b3b7d15bb8a9530c207bb' \
            '_site/index.html' | sha256sum -c -

          test "$(wc -c < _site/index.html)" -eq 181130
          cp compat.html _site/compat.html
          touch _site/.nojekyll

          cat > _site/release-info.json <<'JSON'
          {
            "app": "NIIMBOT B1 Label Studio Ultimate",
            "version": "4.2.0",
            "qualificationCandidate": true,
            "releaseBasis": "physical B1 + iPhone + Bluefy evidence",
            "targetPrinter": "NIIMBOT B1",
            "modelId": 4096,
            "dpi": 203,
            "sha256": "8360ee3661da495538eec598908e470ecfb7aa31b76b3b7d15bb8a9530c207bb",
            "qrProductionProfile": {
              "ecc": "M",
              "minimumDotsPerModule": 3,
              "preferredDotsPerModule": 4,
              "testedLongUrlBytes": 74,
              "testedVersion": 5,
              "testedPrintedDots": 135,
              "testedDensity": 3,
              "singleLabelPhysicalScan": "pass"
            },
            "bundleCeilingBytes": 240,
            "adaptivePaceMs": [10, 40],
            "heartbeatIntervalMs": 15000
          }
          JSON

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
